<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="China Import">
<meta name="color-scheme" content="dark">
<title>China Products</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#0C0C0F;--s1:#13131A;--s2:#1A1A24;--border:rgba(255,255,255,.07);--text:#E8E6E0;--muted:rgba(232,230,224,.4);--gold:#C9A84C;--mint:#2BB89A;--coral:#E8604A;--sky:#5B9FE0;--purple:#9B72CF}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{font-family:'Outfit',sans-serif;color:var(--text);overscroll-behavior:none}
::-webkit-scrollbar{display:none}
input,button{font-family:'Outfit',sans-serif}
input::placeholder{color:rgba(240,237,232,.2)}
input:focus{outline:none}
input[type=date]{color-scheme:dark}
#app{min-height:100vh;padding-bottom:calc(80px + env(safe-area-inset-bottom,0px));background:var(--bg)}

.topbar{background:var(--bg);border-bottom:1px solid var(--border);padding:calc(48px + env(safe-area-inset-top,0px)) 20px 18px}
.topbar-inner{display:flex;justify-content:space-between;align-items:flex-end}
.eyebrow{font-size:10px;font-weight:600;letter-spacing:.18em;color:var(--gold);text-transform:uppercase;margin-bottom:4px;opacity:.85}
.app-title{font-weight:800;font-size:26px;color:var(--text);letter-spacing:-.02em}
.add-btn{background:var(--gold);color:#0C0C0F;border:none;border-radius:12px;padding:11px 22px;font-size:13px;font-weight:700;cursor:pointer;letter-spacing:.02em}

.tabbar{position:fixed;bottom:0;left:0;right:0;background:rgba(13,13,13,.97);backdrop-filter:blur(24px);border-top:1px solid var(--border);display:flex;padding-bottom:env(safe-area-inset-bottom,10px);z-index:100}
.tb{flex:1;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px;color:rgba(240,237,232,.25);transition:color .2s}
.tb.on{color:var(--gold)}
.tb .ic{font-size:19px}
.tb .lb{font-size:9px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}

.page{padding:16px;display:none}
.page.on{display:block}

.hero{background:linear-gradient(145deg,#17171F,#111118);border-radius:22px;padding:26px 22px;margin-bottom:14px;border:1px solid rgba(201,168,76,.15);position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;top:-50px;right:-50px;width:180px;height:180px;background:radial-gradient(circle,rgba(212,174,90,.1),transparent 70%);pointer-events:none}
.hero-label{font-size:10px;font-weight:600;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;margin-bottom:8px}
.hero-num{font-weight:900;font-size:48px;letter-spacing:-2px;line-height:1}
.hero-sub{font-size:12px;color:var(--muted);margin-top:8px}

.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.strip-box{background:var(--s1);border:1px solid var(--border);border-radius:18px;padding:16px 10px;text-align:center;position:relative;overflow:hidden}
.strip-top{position:absolute;top:0;left:0;right:0;height:2px;border-radius:2px 2px 0 0}
.strip-val{font-weight:800;font-size:20px;margin-bottom:3px}
.strip-lbl{font-size:10px;color:var(--muted);letter-spacing:.04em}

.chart-card{background:var(--s1);border:1px solid var(--border);border-radius:20px;padding:18px 14px;margin-bottom:14px}
.chart-title{font-size:10px;font-weight:700;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;margin-bottom:14px}

.pcard{background:var(--s1);border:1px solid var(--border);border-radius:22px;margin-bottom:12px;overflow:hidden}
.pcard-img{width:100%;height:240px;object-fit:contain;display:block;background:var(--s2);padding:12px}
.pcard-img-ph{width:100%;height:240px;background:var(--s2);display:flex;align-items:center;justify-content:center;font-size:50px}
.pcard-body{padding:15px}
.pcard-name{font-weight:700;font-size:16px;color:var(--text);margin-bottom:4px}
.pcard-meta{font-size:11px;color:var(--muted);margin-bottom:12px}
.pcard-profit{font-weight:900;font-size:20px}

.prog-track{height:5px;background:rgba(255,255,255,.07);border-radius:3px;margin-bottom:5px;overflow:hidden}
.prog-fill{height:100%;border-radius:3px;transition:width .6s ease}
.prog-labels{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-bottom:12px}

.stats-row{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:12px}
.stat-cell{text-align:center;padding:10px 4px}
.stat-cell:not(:last-child){border-right:1px solid var(--border)}
.stat-val{font-weight:800;font-size:17px;margin-bottom:2px}
.stat-lbl{font-size:9px;color:var(--muted);font-weight:600;letter-spacing:.05em;text-transform:uppercase}

.pcard-btns{display:flex;gap:8px}
.btn-sale{flex:1;background:rgba(62,207,178,.1);border:1px solid rgba(62,207,178,.22);color:var(--mint);border-radius:12px;padding:10px;font-size:12px;font-weight:700;cursor:pointer}
.btn-edit{background:var(--s2);border:1px solid var(--border);color:var(--muted);border-radius:12px;padding:10px 14px;font-size:12px;font-weight:600;cursor:pointer}

.card{background:var(--s1);border:1px solid var(--border);border-radius:20px;overflow:hidden}
.divider{height:1px;background:var(--border)}
.inv-row{padding:14px 16px;display:flex;align-items:center;gap:12px}
.inv-img{width:46px;height:46px;border-radius:12px;object-fit:contain;background:var(--s2);padding:3px;flex-shrink:0}
.inv-img-ph{width:46px;height:46px;border-radius:12px;background:var(--s2);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.inv-bar{height:4px;background:rgba(255,255,255,.06);border-radius:2px;margin:7px 0 4px;overflow:hidden}
.inv-fill{height:100%;border-radius:2px}
.rep-row{padding:13px 16px;display:flex;align-items:center;gap:12px}

.sec{font-size:10px;font-weight:700;color:rgba(240,237,232,.7);text-transform:uppercase;letter-spacing:.12em;margin-bottom:12px}

.fp{background:var(--s2);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:7px 14px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;flex-shrink:0;color:var(--text)}
.fp.on{background:var(--gold);color:#0D0D0D;border-color:var(--gold);font-weight:700}

.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:flex-end;z-index:200;backdrop-filter:blur(16px)}
.modal-ov.on{display:flex}
.modal-sh{background:var(--s1);border-radius:28px 28px 0 0;padding:22px;width:100%;max-height:93vh;overflow-y:auto;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px));border-top:1px solid rgba(201,168,76,.15)}
.handle{width:36px;height:4px;background:rgba(255,255,255,.1);border-radius:2px;margin:0 auto 20px}
.modal-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.modal-title{font-weight:800;font-size:20px;color:var(--text)}
.close-btn{background:var(--s2);border:none;color:var(--muted);border-radius:10px;width:32px;height:32px;font-size:16px;cursor:pointer}
.fi{width:100%;background:var(--s2);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:13px 15px;font-size:16px;color:var(--text);margin-bottom:12px}
.fl{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;display:block;margin-bottom:5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sub-btn{width:100%;background:var(--gold);color:#0D0D0D;border:none;border-radius:14px;padding:16px;font-size:15px;font-weight:700;cursor:pointer;margin-top:4px}
.del-btn{width:100%;background:transparent;color:var(--coral);border:1px solid rgba(255,107,107,.2);border-radius:14px;padding:13px;font-size:13px;font-weight:600;cursor:pointer;margin-top:10px}
.prev-box{border-radius:12px;padding:13px 15px;margin-bottom:14px;display:none}

.sale-sh{background:var(--s1);border-radius:28px 28px 0 0;padding:22px;width:100%;max-height:65vh;overflow-y:auto;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px));border-top:1px solid rgba(62,207,178,.2)}
.sale-btn{width:100%;background:var(--mint);color:#0D0D0D;border:none;border-radius:14px;padding:16px;font-size:15px;font-weight:700;cursor:pointer}

#loadscreen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:300;flex-direction:column;gap:14px}
#loadscreen.gone{display:none}
.spin{width:34px;height:34px;border:2.5px solid rgba(212,174,90,.15);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.saving{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:16px;background:rgba(62,207,178,.1);border:1px solid rgba(62,207,178,.25);color:var(--mint);border-radius:20px;padding:7px 14px;font-size:11px;font-weight:700;z-index:500;opacity:0;transition:opacity .3s;letter-spacing:.05em}
.saving.show{opacity:1}

.tx-row{padding:13px 16px;display:flex;align-items:center;gap:12px}
</style>
</head>
<body>
<div id="loadscreen"><div class="spin"></div><div style="font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.1em">LOADING</div></div>
<div class="saving" id="savebadge">SAVED ✓</div>
<div id="app">
  <div class="topbar">
    <div class="topbar-inner">
      <div><div class="eyebrow">China Import</div><div class="app-title">Products Ledger</div></div>
      <button class="add-btn" onclick="openAdd()">＋ Add</button>
    </div>
  </div>

  <div id="phome" class="page on">
    <div class="hero">
      <div class="hero-label">Net Profit</div>
      <div class="hero-num" id="hprofit">$0</div>
      <div class="hero-sub" id="hsub">—</div>
    </div>
    <div class="strip">
      <div class="strip-box"><div class="strip-top" style="background:var(--gold)"></div><div class="strip-val" id="krev" style="color:var(--gold)">$0</div><div class="strip-lbl">Revenue</div></div>
      <div class="strip-box"><div class="strip-top" style="background:var(--mint)"></div><div class="strip-val" id="ksold" style="color:var(--mint)">0</div><div class="strip-lbl">Sold</div></div>
      <div class="strip-box"><div class="strip-top" style="background:var(--sky)"></div><div class="strip-val" id="kstock" style="color:var(--sky)">0</div><div class="strip-lbl">In Stock</div></div>
    </div>
    <div class="chart-card"><div class="chart-title">Revenue vs Cost</div><div style="position:relative;height:150px"><canvas id="mchart"></canvas></div></div>
    <div class="sec">All Products</div>
    <div id="homeplist"></div>
  </div>

  <div id="pinventory" class="page">
    <div class="sec">Stock Overview</div>
    <div class="card" id="invlist"></div>
  </div>

  <div id="preports" class="page">
    <div class="chart-card" style="margin-bottom:14px"><div class="chart-title">Profit by Product</div><div style="position:relative;height:220px"><canvas id="cchart"></canvas></div></div>
    <div class="sec">Sell-Through Rate</div>
    <div class="card" style="margin-bottom:14px" id="strlist"></div>
    <div class="sec">Days in Inventory</div>
    <div class="card" id="agelist"></div>
  </div>

  <div id="ptransactions" class="page">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <div class="sec" style="margin-bottom:0">Sales Log</div>
      <div id="tx-total" style="font-size:12px;font-weight:700;color:var(--mint)"></div>
    </div>
    <div style="display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px" id="tx-filters"></div>
    <div class="card" id="txlist"></div>
  </div>

  <div class="tabbar">
    <button class="tb on" onclick="swTab('home',this)">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span class="lb">Home</span></button>
    <button class="tb" onclick="swTab('inventory',this)">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
      <span class="lb">Stock</span></button>
    <button class="tb" onclick="swTab('reports',this)">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
      <span class="lb">Reports</span></button>
    <button class="tb" onclick="swTab('transactions',this)">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="9" y1="7" x2="15" y2="7"/><line x1="9" y1="11" x2="15" y2="11"/><line x1="9" y1="15" x2="13" y2="15"/></svg>
      <span class="lb">Sales Log</span></button>
  </div>
</div>

<!-- ADD/EDIT MODAL -->
<div class="modal-ov" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal-sh">
    <div class="handle"></div>
    <div class="modal-hdr"><div id="mtitle" class="modal-title">New Product</div><button class="close-btn" onclick="closeModal()">✕</button></div>
    <label class="fl">Product Name</label><input class="fi" id="fname" placeholder="e.g. Brass Shower Set">
    <label class="fl">Product Photo</label>
    <div id="photo-preview" style="display:none;margin-bottom:12px;position:relative">
      <img id="preview-img" style="width:100%;height:160px;object-fit:cover;border-radius:12px;display:block">
      <button onclick="clearPhoto()" style="position:absolute;top:8px;right:8px;background:rgba(0,0,0,.6);border:none;color:#fff;border-radius:20px;width:28px;height:28px;font-size:13px;cursor:pointer">✕</button>
    </div>
    <label id="photo-upload-btn" style="display:block;background:var(--s2);border:1px dashed rgba(255,255,255,.15);border-radius:12px;padding:16px;text-align:center;cursor:pointer;margin-bottom:12px;color:var(--muted);font-size:13px;font-weight:600">
      📷 Tap to upload photo
      <input type="file" id="fphoto" accept="image/*" style="display:none" onchange="handlePhoto(this)">
    </label>
    <label class="fl">Icon (emoji)</label><input class="fi" id="femoji" placeholder="📦" style="font-size:22px">
    <div class="grid2">
      <div><label class="fl">Total Qty</label><input class="fi" id="fqty" type="number" min="0" placeholder="0"></div>
      <div><label class="fl">Cost/Unit ($)</label><input class="fi" id="funitcost" type="number" min="0" step="0.01" placeholder="0.00"></div>
    </div>
    <div class="grid2">
      <div><label class="fl">Total Cost ($)</label><input class="fi" id="ftotalcost" type="number" min="0" step="0.01" placeholder="0.00" oninput="uprev()"></div>
      <div><label class="fl">Avg Sale ($)</label><input class="fi" id="favgsale" type="number" min="0" step="0.01" placeholder="Auto-calc"></div>
    </div>
    <div class="grid2">
      <div><label class="fl">Units Sold</label><input class="fi" id="funits" type="number" min="0" placeholder="0"></div>
      <div><label class="fl">Defective</label><input class="fi" id="fdefect" type="number" min="0" placeholder="0"></div>
    </div>
    <div class="grid2">
      <div><label class="fl">Revenue ($)</label><input class="fi" id="frev" type="number" min="0" step="0.01" placeholder="0.00" oninput="uprev()"></div>
      <div><label class="fl">Purchase Date</label><input class="fi" id="fdp" type="date"></div>
    </div>
    <div class="prev-box" id="prev">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span id="pproft" style="font-weight:800;font-size:15px"></span>
        <span id="proi" style="font-size:12px;color:var(--muted)"></span>
      </div>
    </div>
    <button class="sub-btn" id="subbtn" onclick="saveProduct()">Add Product</button>
    <button class="del-btn" id="delbtn" style="display:none" onclick="delProduct()">🗑 Delete Product</button>
  </div>
</div>

<!-- SALE MODAL -->
<div class="modal-ov" id="salemodal" onclick="if(event.target===this)closeSaleModal()">
  <div class="sale-sh">
    <div class="handle"></div>
    <div style="font-weight:800;font-size:18px;color:var(--text);margin-bottom:4px">Log a Sale</div>
    <div id="sname" style="font-size:12px;color:var(--muted);margin-bottom:18px"></div>
    <label class="fl">Units Sold</label><input class="fi" id="fsaleunits" type="number" min="1" placeholder="1">
    <label class="fl">Sale Amount ($)</label><input class="fi" id="fsaleamt" type="number" min="0" step="0.01" placeholder="0.00">
    <label class="fl">Date of Sale</label><input class="fi" id="fsaledate" type="date">
    <button class="sale-btn" onclick="confirmSale()">✓ Confirm Sale</button>
  </div>

function $m(v){ return (v<0?"-$":"$")+Math.abs(v).toLocaleString("en",{maximumFractionDigits:0}); }
function dSince(d){ if(!d) return 0; return Math.floor((Date.now()-new Date(d))/86400000); }
function fmtDate(d){ if(!d) return ""; var p=d.split("T")[0].split("-"); var mn=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"]; return mn[parseInt(p[1])-1]+" "+parseInt(p[2])+", 20"+p[0].slice(2); }
function showSaved(){ var b=document.getElementById("savebadge"); b.className="saving show"; setTimeout(function(){ b.className="saving"; },1600); }

function calc(p){
  var qty=Number(p.qty)||0, sold=Number(p.unitsSold)||0, def=Number(p.unitsDefect)||0;
  var inStock=Math.max(0,qty-sold-def);
  var profit=(Number(p.revenue)||0)-(Number(p.totalCost)||0);
  var str=qty>0?Math.round((sold/qty)*100):0;
  var roi=(Number(p.totalCost)||0)>0?Math.round((profit/(Number(p.totalCost)||0))*100):0;
  return {inStock:inStock,profit:profit,str:str,roi:roi};
}

function loadLocal(){
  try{
    var s=localStorage.getItem("china_v3"); if(s){ var d=JSON.parse(s); if(Array.isArray(d)&&d.length>0) products=d; }
    var t=localStorage.getItem("china_v3_tx"); if(t) transactions=JSON.parse(t)||[];
    return products.length>0;
  }catch(e){} return false;
}

function saveLocal(){
  try{ localStorage.setItem("china_v3",JSON.stringify(products)); localStorage.setItem("china_v3_tx",JSON.stringify(transactions)); showSaved(); }catch(e){}
}

function backupToSheets(){
  try{
    var slim=products.map(function(p){ var n=Object.assign({},p); delete n.img; return n; });
    fetch(SHEET_URL,{method:"POST",body:JSON.stringify(slim)}).catch(function(){});
  }catch(e){}
}

function restoreFromSheets(){
  return fetch(SHEET_URL).then(function(r){ return r.json(); }).then(function(data){
    if(!Array.isArray(data)||data.length===0) return false;
    products=data.map(function(r){
      var raw=RAW.filter(function(x){ return x.id==r.id; })[0];
      return {
        id:Number(r.id)||Date.now(), name:r.name||"", emoji:r.emoji||"📦", img:raw?raw.img:null,
        qty:Number(r.qty)||0, unitCost:Number(r.unitCost)||0, totalCost:Number(r.totalCost)||0,
        avgSale:Number(r.avgSale)||0, unitsSold:Number(r.unitsSold)||0, unitsDefect:Number(r.unitsDefect)||0,
        revenue:Number(r.revenue)||0, purchaseDate:(r.purchaseDate||"").split("T")[0]||""
      };
    });
    return true;
  });
}

function scheduleSave(){ clearTimeout(saveTimer); saveTimer=setTimeout(function(){ saveLocal(); backupToSheets(); },400); }

function hideLoader(){ try{ document.getElementById("loadscreen").className="gone"; }catch(e){} }

function init(){
  setTimeout(hideLoader,5000);
  try{
    if(loadLocal()){ hideLoader(); renderAll(); return; }
  }catch(e){}
  var done=false;
  function finish(ok){
    if(done) return; done=true;
    if(!ok||!products.length) products=RAW.map(function(p){ return Object.assign({},p); });
    saveLocal(); backupToSheets(); hideLoader(); renderAll();
  }
  setTimeout(function(){ finish(false); },4000);
  try{ restoreFromSheets().then(function(ok){ finish(ok); }).catch(function(){ finish(false); }); }catch(e){ finish(false); }
}

function renderAll(){ renderHome(); renderInventory(); renderReports(); }

function renderHome(){
  var tp=0,tr=0,tc=0,ts=0,tst=0;
  products.forEach(function(p){ var c=calc(p); tp+=c.profit; tr+=Number(p.revenue)||0; tc+=Number(p.totalCost)||0; ts+=Number(p.unitsSold)||0; tst+=c.inStock; });
  var hel=document.getElementById("hprofit"); hel.textContent=$m(tp); hel.style.color=tp>=0?"var(--gold)":"var(--coral)";
  document.getElementById("hsub").textContent="$"+Math.round(tc).toLocaleString()+" invested · $"+Math.round(tr).toLocaleString()+" revenue";
  document.getElementById("krev").textContent="$"+Math.round(tr).toLocaleString();
  document.getElementById("ksold").textContent=ts;
  document.getElementById("kstock").textContent=tst;
  renderBarChart(); renderHomeList();
}

function renderInventory(){
  var sorted=products.slice().sort(function(a,b){ return calc(b).inStock-calc(a).inStock; });
  var html="";
  sorted.forEach(function(p,i){
    var c=calc(p),idx=products.indexOf(p),pal=PALETTE[idx%PALETTE.length];
    var age=dSince(p.purchaseDate),ageCol=age>60?"var(--coral)":age>30?"#FBBF24":"var(--mint)",ageTag=age>60?"STALE":age>30?"SLOW":"FRESH";
    var pct=(Number(p.qty)||0)>0?Math.round((c.inStock/(Number(p.qty)||0))*100):0;
    if(i>0) html+='<div class="divider"></div>';
    html+='<div class="inv-row">';
    if(p.img) html+='<img src="'+p.img+'" class="inv-img">';
    else html+='<div class="inv-img-ph">'+p.emoji+'</div>';
    html+='<div style="flex:1;min-width:0"><div style="font-weight:700;font-size:14px;color:var(--text);margin-bottom:2px">'+p.name+'</div>';
    html+='<div class="inv-bar"><div class="inv-fill" style="width:'+pct+'%;background:'+pal.acc+'"></div></div>';
    html+='<div style="display:flex;justify-content:space-between;font-size:10px"><span style="color:var(--muted)">'+pct+'% left · '+(Number(p.unitsSold)||0)+' sold</span><span style="color:'+ageCol+';font-weight:700">'+age+'d · '+ageTag+'</span></div>';
    if((Number(p.unitsDefect)||0)>0) html+='<div style="font-size:10px;color:var(--coral);margin-top:3px">⚠ '+(Number(p.unitsDefect)||0)+' defective</div>';

  var ctx=document.getElementById("cchart").getContext("2d");
  if(cChart) cChart.destroy();

    sh+='<div style="font-size:10px;color:var(--muted);margin-top:4px">'+(Number(p.unitsSold)||0)+' of '+(Number(p.qty)||0)+' sold · '+c.inStock+' remaining</div></div>';

function renderTransactions(){
  var names={};
  transactions.forEach(function(t){ names[t.productId]=t.productName; });
  var chips="";
  var allCls="fp"+(txFilter==="all"?" on":"");
  chips+='<button class="'+allCls+'" onclick="setTxFilter(&#39;all&#39;)">All</button>';
  Object.keys(names).forEach(function(pid){
    var cls="fp"+(txFilter===pid?" on":"");
    var label=names[pid].split(" ").slice(0,2).join(" ");
    chips+='<button class="'+cls+'" onclick="setTxFilter(&#39;'+pid+'&#39;)">'+label+'</button>';
  });
  document.getElementById("tx-filters").innerHTML=chips;

  var f=transactions.slice();
  if(txFilter!=="all") f=f.filter(function(t){ return String(t.productId)===String(txFilter); });
  f.sort(function(a,b){ return b.id-a.id; });

  var totAmt=f.reduce(function(s,t){ return s+(t.amount||0); },0);
  document.getElementById("tx-total").textContent=f.length+" sales · $"+Math.round(totAmt).toLocaleString();

  if(!f.length){
    document.getElementById("txlist").innerHTML='<div style="padding:30px;text-align:center;color:var(--muted);font-size:13px">No sales yet.<br>Tap + Log Sale on any product.</div>';
    return;
  }
  var html="";
  f.forEach(function(t,i){
    var idx=products.findIndex(function(p){ return p.id===t.productId; });
    var pal=PALETTE[idx>=0?idx%PALETTE.length:0];
    var prod=products.filter(function(p){ return p.id===t.productId; })[0];
    if(i>0) html+='<div class="divider"></div>';
    html+='<div class="tx-row">';
    if(prod&&prod.img) html+='<img src="'+prod.img+'" style="width:42px;height:42px;border-radius:12px;object-fit:contain;background:var(--s2);padding:2px;flex-shrink:0">';
    else html+='<div style="width:42px;height:42px;border-radius:12px;background:'+pal.bg+';display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0">'+(prod?prod.emoji:"&#x1F4E6;")+'</div>';
    html+='<div style="flex:1;min-width:0"><div style="font-weight:700;font-size:14px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+t.productName+'</div>';
    html+='<div style="font-size:11px;color:var(--muted);margin-top:2px">'+fmtDate(t.date)+'</div>';
    html+='<div style="font-size:11px;color:var(--muted);margin-top:1px">'+t.units+' unit'+(t.units>1?"s":"")+(t.pricePerUnit?' &middot; $'+Number(t.pricePerUnit).toFixed(2)+'/unit':'')+'</div></div>';
    html+='<div style="text-align:right;flex-shrink:0"><div style="font-weight:800;font-size:18px;color:var(--mint)">$'+(t.amount||0).toFixed(0)+'</div></div></div>';
  });
  document.getElementById("txlist").innerHTML=html;
}

function setTxFilter(v){ txFilter=v; renderTransactions(); }

// Photo handling
function handlePhoto(input){
  var file=input.files[0]; if(!file) return;
  var img2=new Image();
  var fr=new FileReader();
  fr.onload=function(e){
    img2.onload=function(){
      var canvas=document.createElement("canvas");
      var maxW=600,w=img2.width,ht=img2.height;
      if(w>maxW){ ht=Math.round(ht*(maxW/w)); w=maxW; }
      canvas.width=w; canvas.height=ht;
      canvas.getContext("2d").drawImage(img2,0,0,w,ht);
      pendingImg=canvas.toDataURL("image/jpeg",0.75);
      document.getElementById("preview-img").src=pendingImg;
      document.getElementById("photo-preview").style.display="block";
      document.getElementById("photo-upload-btn").style.display="none";
    };
    img2.src=e.target.result;
  };
  fr.readAsDataURL(file);
}
function clearPhoto(){ pendingImg=null; document.getElementById("photo-preview").style.display="none"; document.getElementById("photo-upload-btn").style.display="block"; document.getElementById("fphoto").value=""; }
function setPhotoPreview(src){ if(src){ pendingImg=src; document.getElementById("preview-img").src=src; document.getElementById("photo-preview").style.display="block"; document.getElementById("photo-upload-btn").style.display="none"; } else { clearPhoto(); } }

// Modals
function openAdd(){
  editId=null; pendingImg=null;
  document.getElementById("mtitle").textContent="New Product";
  document.getElementById("subbtn").textContent="Add Product";
  document.getElementById("delbtn").style.display="none";
  ["fname","femoji","fqty","funitcost","ftotalcost","favgsale","funits","fdefect","frev"].forEach(function(id){ document.getElementById(id).value=""; });
  document.getElementById("fdp").value=new Date().toISOString().slice(0,10);
  document.getElementById("prev").style.display="none";
  clearPhoto();
  document.getElementById("modal").className="modal-ov on";
  setTimeout(function(){ document.getElementById("fname").focus(); },100);
}
function openEdit(id){
  var p=products.filter(function(x){ return x.id===id; })[0]; if(!p) return;
  editId=id;
  document.getElementById("mtitle").textContent="Edit Product";
  document.getElementById("subbtn").textContent="Save Changes";
  document.getElementById("delbtn").style.display="block";
  document.getElementById("fname").value=p.name||"";
  document.getElementById("femoji").value=p.emoji||"";
  document.getElementById("fqty").value=p.qty||"";
  document.getElementById("funitcost").value=p.unitCost||"";
  document.getElementById("ftotalcost").value=p.totalCost||"";
  document.getElementById("favgsale").value=p.avgSale||"";
  document.getElementById("funits").value=p.unitsSold||"";
  document.getElementById("fdefect").value=p.unitsDefect||"";
  document.getElementById("frev").value=p.revenue||"";
  document.getElementById("fdp").value=p.purchaseDate||"";
  setPhotoPreview(p.img||null);
  uprev();
  document.getElementById("modal").className="modal-ov on";
}
function closeModal(){ document.getElementById("modal").className="modal-ov"; }

function uprev(){
  var cost=parseFloat(document.getElementById("ftotalcost").value),rev=parseFloat(document.getElementById("frev").value),el=document.getElementById("prev");
  if(!isNaN(cost)&&!isNaN(rev)){
    var pr=rev-cost,roi=cost>0?((pr/cost)*100).toFixed(0):0;
    el.style.display="block"; el.style.background=pr>=0?"rgba(62,207,178,.08)":"rgba(255,107,107,.08)";
    el.style.border="1px solid "+(pr>=0?"rgba(62,207,178,.2)":"rgba(255,107,107,.2)");
    document.getElementById("pproft").textContent=(pr>=0?"↑ +":"↓ ")+$m(Math.abs(pr))+" profit";
    document.getElementById("pproft").style.color=pr>=0?"var(--mint)":"var(--coral)";
    document.getElementById("proi").textContent=roi+"% ROI";
  } else { el.style.display="none"; }
}

function saveProduct(){
  var name=document.getElementById("fname").value.trim(); if(!name) return;
  var existing=editId?products.filter(function(x){ return x.id===editId; })[0]:null;
  var rev=parseFloat(document.getElementById("frev").value)||0;
  var units=parseInt(document.getElementById("funits").value)||0;
  var p={
    id:editId||Date.now(), name:name,
    emoji:document.getElementById("femoji").value||"📦",
    img:pendingImg!==null?pendingImg:(existing?existing.img:null),
    qty:parseInt(document.getElementById("fqty").value)||0,
    unitCost:parseFloat(document.getElementById("funitcost").value)||0,
    totalCost:parseFloat(document.getElementById("ftotalcost").value)||0,
    avgSale:parseFloat(document.getElementById("favgsale").value)||(units>0?Math.round((rev/units)*100)/100:0),
    unitsSold:units, unitsDefect:parseInt(document.getElementById("fdefect").value)||0,
    revenue:rev, purchaseDate:document.getElementById("fdp").value||new Date().toISOString().slice(0,10)
  };
  if(editId) products=products.map(function(x){ return x.id===editId?p:x; });
  else products.push(p);
  closeModal(); renderAll(); scheduleSave();
}
function delProduct(){ if(!confirm("Delete this product?")) return; products=products.filter(function(p){ return p.id!==editId; }); closeModal(); renderAll(); scheduleSave(); }

function openSale(id){
  saleId=id;
  var p=products.filter(function(x){ return x.id===id; })[0];
  document.getElementById("sname").textContent=p?p.name:"";
  document.getElementById("fsaleunits").value="1";
  document.getElementById("fsaleamt").value=p&&p.avgSale?Number(p.avgSale).toFixed(2):"";
  document.getElementById("fsaledate").value=new Date().toISOString().slice(0,10);
  document.getElementById("salemodal").className="modal-ov on";
  setTimeout(function(){ document.getElementById("fsaleunits").focus(); },100);
}
function closeSaleModal(){ document.getElementById("salemodal").className="modal-ov"; }
function confirmSale(){
  var units=parseInt(document.getElementById("fsaleunits").value)||0;
  var amt=parseFloat(document.getElementById("fsaleamt").value)||0;
  var saleDate=document.getElementById("fsaledate").value||new Date().toISOString().slice(0,10);
  if(!units||!saleId) return;
  var ppu=units>0?Math.round((amt/units)*100)/100:0;
  products=products.map(function(p){
    if(p.id!==saleId) return p;
    var n=Object.assign({},p);
    n.unitsSold=(Number(n.unitsSold)||0)+units;
    n.revenue=(Number(n.revenue)||0)+amt;
    n.avgSale=n.unitsSold>0?Math.round((n.revenue/n.unitsSold)*100)/100:0;
    return n;
  });
  var prod=products.filter(function(p){ return p.id===saleId; })[0];
  transactions.push({ id:Date.now(), productId:saleId, productName:prod?prod.name:"", units:units, amount:amt, pricePerUnit:ppu, date:saleDate });
  closeSaleModal(); renderAll(); scheduleSave();
}

function swTab(tab,btn){
  document.querySelectorAll(".page").forEach(function(p){ p.classList.remove("on"); });
  document.querySelectorAll(".tb").forEach(function(b){ b.classList.remove("on"); });
  document.getElementById("p"+tab).classList.add("on");
  btn.classList.add("on");
  if(tab==="transactions") renderTransactions();
}

init();
</script>
</body>
